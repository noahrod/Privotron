name: MyLife
slug: mylife
url: https://www.mylife.com/ccpa/index.pubview
required_fields:
  - first_name
  - last_name
  - email
  - state
steps:
  - action: navigate
    url: "https://www.mylife.com/ccpa/index.pubview"
  - action: fill
    selector: '[name="firstName"]'
    field: first_name
  - action: fill
    selector: '[name="lastName"]'
    field: last_name
  - action: fill
    selector: '[name="email"]'
    field: email
  - action: select_state
    selector: '[name="state"]'
    format: abbr
  - action: click
    selector: '[type="submit"]'
  - action: wait
    seconds: 5
  - action: prompt_user_to_select_record
    description: "Select your record to remove from MyLife"
