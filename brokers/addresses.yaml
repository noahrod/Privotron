name: Addresses.com
slug: addresses
url: https://www.addresses.com/optout.php
required_fields:
  - first_name
  - last_name
  - state
  - city
steps:
  - action: navigate
    url: "https://www.addresses.com/optout.php"
  - action: fill
    selector: '[name="fname"]'
    field: first_name
  - action: fill
    selector: '[name="lname"]'
    field: last_name
  - action: fill
    selector: '[name="city"]'
    field: city
  - action: select_state
    selector: '[name="state"]'
    format: abbr
  - action: click
    selector: '[type="submit"]'
  - action: wait
    seconds: 3
  - action: prompt_user_to_select_record
    description: "Select your record to remove from Addresses.com"
