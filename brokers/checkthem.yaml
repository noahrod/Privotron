name: CheckThem
slug: checkthem
url: https://www.checkthem.com/optout/
required_fields:
  - first_name
  - last_name
  - state
  - city
steps:
  - action: navigate
    url: "https://www.checkthem.com/optout/"
  - action: fill
    selector: '[name="firstname"]'
    field: first_name
  - action: fill
    selector: '[name="lastname"]'
    field: last_name
  - action: fill
    selector: '[name="city"]'
    field: city
  - action: select_state
    selector: '[name="state"]'
    format: abbr
  - action: click
    selector: '[type="submit"]'
  - action: wait
    seconds: 5
  - action: prompt_user_to_select_record
    description: "Select your record to opt out from CheckThem"
