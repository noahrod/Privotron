name: PeopleFinders
slug: peoplefinders
url: https://www.peoplefinders.com/opt-out
required_fields:
  - first_name
  - last_name
  - state
  - city
steps:
  - action: navigate
    url: "https://www.peoplefinders.com/opt-out"
  - action: fill
    selector: '#first'
    field: first_name
  - action: fill
    selector: '#last'
    field: last_name
  - action: fill
    selector: '#city'
    field: city
  - action: select_state
    selector: '#state'
    format: abbr
  - action: click
    selector: '[type="submit"]'
  - action: wait
    seconds: 5
  - action: prompt_user_to_select_record
    description: "Select your record to opt out from PeopleFinders"
