name: Spokeo
slug: spokeo
url: https://www.spokeo.com/optout
required_fields:
  - first_name
  - last_name
  - state
  - city
steps:
  - action: navigate
    url: "https://www.spokeo.com/optout"
  - action: fill
    selector: '#first_name'
    field: first_name
  - action: fill
    selector: '#last_name'
    field: last_name
  - action: fill
    selector: '#city'
    field: city
  - action: select_state
    selector: '#state'
  - action: click
    selector: '[type="submit"]'
  - action: wait
    seconds: 3
  - action: prompt_user_to_select_record
    description: "Select your record to remove from Spokeo"
