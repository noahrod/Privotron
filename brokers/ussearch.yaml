name: US Search
slug: ussearch
url: https://www.ussearch.com/opt-out/submit/
required_fields:
  - first_name
  - last_name
  - state
  - city
steps:
  - action: navigate
    url: "https://www.ussearch.com/opt-out/submit/"
  - action: fill
    selector: '#first_name'
    field: first_name
  - action: fill
    selector: '#last_name'
    field: last_name
  - action: fill
    selector: '#city'
    field: city
  - action: select_state
    selector: '#state'
    format: abbr
  - action: click
    selector: '[type="submit"]'
  - action: wait
    seconds: 5
  - action: prompt_user_to_select_record
    description: "Select your record to opt out from US Search"
