name: PrivateEye
slug: privateeye
url: https://www.privateeye.com/static/view/optout/
required_fields:
  - first_name
  - last_name
  - state
  - city
steps:
  - action: navigate
    url: "https://www.privateeye.com/static/view/optout/"
  - action: fill
    selector: '[name="firstName"]'
    field: first_name
  - action: fill
    selector: '[name="lastName"]'
    field: last_name
  - action: fill
    selector: '[name="city"]'
    field: city
  - action: select_state
    selector: '[name="state"]'
    format: abbr
  - action: click
    selector: '[type="submit"]'
  - action: wait
    seconds: 5
  - action: prompt_user_to_select_record
    description: "Select your record to opt out from PrivateEye"
