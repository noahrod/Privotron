name: USPhoneBook
slug: usphonebook
url: https://www.usphonebook.com/opt-out
required_fields:
  - first_name
  - last_name
  - state
  - city
steps:
  - action: navigate
    url: "https://www.usphonebook.com/opt-out"
  - action: fill
    selector: '[name="first_name"]'
    field: first_name
  - action: fill
    selector: '[name="last_name"]'
    field: last_name
  - action: fill
    selector: '[name="city"]'
    field: city
  - action: select_state
    selector: '[name="state"]'
    format: abbr
  - action: click
    selector: '[type="submit"]'
  - action: wait
    seconds: 5
  - action: prompt_user_to_select_record
    description: "Select your record to remove from USPhoneBook"
